<!doctype html>
<html lang="vi" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Trương Thiện Thư | IT Student & Software Engineering Portfolio</title>
    <meta name="title" content="Trương Thiện Thư | IT Student & Software Engineering Portfolio" />
    <meta name="description" content="Portfolio cá nhân của Trương Thiện Thư - Sinh viên năm 2 ngành Công nghệ Thông tin, Đại học Bình Dương (Phân hiệu Cà Mau). Định hướng Web Development & Software Engineering." />
    <meta name="author" content="Trương Thiện Thư" />
    <meta name="keywords" content="Trương Thiện Thư, Portfolio, Web Developer, Software Engineer, IT Student, Đại học Bình Dương, Cà Mau, React, Vite, Tailwind CSS" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Trương Thiện Thư | IT Student Portfolio" />
    <meta property="og:description" content="Portfolio cá nhân của Trương Thiện Thư - Dự án, kỹ năng lập trình và hành trình học tập ngành Công nghệ Thông tin." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Trương Thiện Thư | IT Student Portfolio" />
    <meta property="twitter:description" content="Portfolio cá nhân của Trương Thiện Thư - Sinh viên CNTT." />
    <meta property="twitter:image" content="/og-image.png" />

    <!-- Google Fonts Preconnect & Load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Oswald:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Synchronous Theme Initialization to Eliminate FOUC -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('thien-thu-portfolio-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-cyan-500/20 selection:text-cyan-500 dark:selection:text-cyan-300 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
